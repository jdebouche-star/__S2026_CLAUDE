name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DXClusterBoard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DXClusterBoard-apk
          path: android/DXClusterBoard.apk

      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: DX Cluster Board for Android (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: android/DXClusterBoard.apk
          body: |
            Version 1.0.${{ github.run_number }} of DX Cluster Board for Android (commit ${{ github.sha }}).
            You can check the installed version at the bottom of the Clusters page.
            Open this page on your phone, tap DXClusterBoard.apk and install it.

  # Start the app on emulators, run the demo, tap around at random,
  # and check that the crash report screen works. Saves logcat + screenshots.
  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DXClusterBoard-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r DXClusterBoard.apk
            adb logcat -c
            adb shell am start -W -n org.dxboard.app/.MainActivity
            sleep 15
            adb exec-out screencap -p > 1-start.png
            adb shell am force-stop org.dxboard.app
            adb shell am start -W -n org.dxboard.app/.MainActivity --ez demo true
            sleep 20
            adb exec-out screencap -p > 2-demo-spots.png
            adb shell monkey -p org.dxboard.app --pct-syskeys 0 --throttle 120 -v 600 > monkey.txt 2>&1 || true
            sleep 3
            adb exec-out screencap -p > 3-after-monkey.png
            adb logcat -d -b crash > logcat.txt || true
            adb shell am force-stop org.dxboard.app || true
            adb shell am start -n org.dxboard.app/.MainActivity --ez crashtest true
            sleep 6
            adb shell am start -W -n org.dxboard.app/.MainActivity
            sleep 6
            adb exec-out screencap -p > 4-crash-report.png
            adb shell dumpsys activity activities | grep -c "org.dxboard.app/.CrashActivity" > crashscreen.txt || true
            adb logcat -d -s DxBoard > app-log.txt || true

      - name: Check results
        if: always()
        run: |
          echo "--- app log ---"; head -40 app-log.txt || true
          echo "--- monkey ---"; tail -5 monkey.txt || true
          if grep -q "// CRASH" monkey.txt; then grep -A 30 "// CRASH" monkey.txt; echo "::error::Crash during random taps"; exit 1; fi
          grep -n -A 40 "FATAL EXCEPTION" logcat.txt | head -150 || true
          if grep -q "FATAL EXCEPTION" logcat.txt; then echo "::error::The app crashed"; exit 1; fi
          if [ "$(cat crashscreen.txt 2>/dev/null || echo 0)" = "0" ]; then echo "::error::Crash report screen did not show"; exit 1; fi
          echo "OK: no crash, crash report screen works"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results-api${{ matrix.api-level }}
          path: |
            *.png
            *.txt
