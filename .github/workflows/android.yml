name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DXClusterBoard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DXClusterBoard-apk
          path: android/DXClusterBoard.apk

      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: DX Cluster Board for Android (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: android/DXClusterBoard.apk
          body: |
            Latest Android build of DX Cluster Board (commit ${{ github.sha }}).
            Open this page on your phone, tap DXClusterBoard.apk and install it.

  # Start the app on an emulator, run the demo, save logcat + screenshots.
  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DXClusterBoard-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator (Android 15)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r DXClusterBoard.apk
            adb logcat -c
            adb shell am start -W -n org.dxboard.app/.MainActivity
            sleep 12
            adb exec-out screencap -p > 1-start.png
            adb shell am force-stop org.dxboard.app
            adb shell am start -W -n org.dxboard.app/.MainActivity --ez demo true
            sleep 25
            adb exec-out screencap -p > 2-demo-spots.png
            adb shell pidof org.dxboard.app || echo "APP NOT RUNNING"
            adb logcat -d > logcat.txt

      - name: Show crashes
        if: always()
        run: |
          grep -n -A 40 "FATAL EXCEPTION\|AndroidRuntime" logcat.txt | head -150 || true
          if grep -q "FATAL EXCEPTION" logcat.txt; then echo "::error::The app crashed"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: |
            *.png
            logcat.txt
